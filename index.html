<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <title>All-Code Cheat Sheet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <meta name="description" content="Koodin muistilappuja ja esimerkkejä usealle eri kielelle, suomeksi." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />
  <style>
    :root {
      --accent: #6366f1;
      --accent-2: #a855f7;
      --accent-dark: #4f46e5;
      --bg: #09090b;
      --bg-soft: #131316;
      --bg-elevated: #18181b;
      --text: #f4f4f5;
      --text-soft: #a1a1aa;
      --text-faint: #71717a;
      --border: #27272a;
      --code-bg: #131316;
      --theme-color: var(--accent);
      --header-h: 60px;
      --header-bg: rgba(9, 9, 11, 0.72);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --bg-soft: #f6f6f8;
        --bg-elevated: #ffffff;
        --text: #18181b;
        --text-soft: #52525b;
        --text-faint: #8a8a93;
        --border: #e4e4e7;
        --code-bg: #f6f6f8;
        --header-bg: rgba(255, 255, 255, 0.72);
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      color: var(--text);
    }

    pre, code, kbd {
      font-family: 'JetBrains Mono', "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace !important;
    }

    /* --- Yläpalkki (kiinteä, kaikilla sivuilla) --- */
    #site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    #site-header .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      text-decoration: none !important;
    }
    #site-header .brand .logo-badge {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    #site-header .links {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    #site-header a.ghlink {
      color: var(--text-soft);
      font-size: 0.85rem;
      text-decoration: none !important;
      transition: color 0.15s ease;
    }
    #site-header a.ghlink:hover {
      color: var(--accent);
    }

    /* --- Sivupalkki --- */
    .sidebar {
      background: var(--bg-soft);
      border-right: 1px solid var(--border);
      top: var(--header-h) !important;
      height: calc(100vh - var(--header-h)) !important;
    }
    .content {
      padding-top: var(--header-h);
    }
    .sidebar-nav a {
      color: var(--text-soft);
      border-radius: 8px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .sidebar-nav a:hover {
      color: var(--text);
      background: var(--bg-elevated);
    }
    .sidebar-nav li.active > a {
      color: #fff;
      font-weight: 600;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }
    .sidebar-nav > ul > li > a {
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0.01em;
      color: var(--text);
    }
    .sidebar ul li ul {
      border-left: 1px solid var(--border);
      margin-left: 8px;
      padding-left: 4px;
    }
    .sidebar-nav strong, .app-name-link {
      color: var(--text) !important;
    }

    /* --- Sisältöalue --- */
    .markdown-section {
      max-width: 820px;
      padding: 30px 40px 80px;
    }
    .markdown-section h1 {
      font-size: 2.1rem;
      font-weight: 800;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.4em;
    }
    .markdown-section h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 2.2em;
      padding-top: 0.4em;
      border-top: 1px solid var(--border);
    }
    .markdown-section h3 { font-weight: 700; }
    .markdown-section p, .markdown-section li {
      line-height: 1.7;
      color: var(--text);
    }
    .markdown-section a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(99, 102, 241, 0.35);
    }
    .markdown-section a:hover {
      border-bottom-color: var(--accent);
    }

    /* --- Koodilohkot --- */
    .markdown-section pre {
      background: var(--code-bg) !important;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .markdown-section code {
      background: var(--bg-elevated);
      border-radius: 5px;
      padding: 0.15em 0.4em;
      font-size: 0.85em;
    }
    .markdown-section pre > code {
      padding: 0;
      background: transparent;
    }
    .docsify-copy-code-button {
      background: var(--bg-elevated) !important;
      border: 1px solid var(--border) !important;
      color: var(--text-soft) !important;
      border-radius: 6px !important;
      /* aiemmin nakymatta ennen hoveria (opacity:0) - kosketuslaitteilla
         "hover" ei koskaan laukea, joten nappi ei nakynyt ollenkaan.
         Nyt aina lievasti nakyvissa ja taysin nakyva hoverissa/fokuksessa. */
      opacity: 0.55 !important;
    }
    .markdown-section pre:hover .docsify-copy-code-button,
    .docsify-copy-code-button:hover,
    .docsify-copy-code-button:focus {
      opacity: 1 !important;
      color: #fff !important;
      background: var(--accent) !important;
      border-color: var(--accent) !important;
    }
    @media (hover: none) {
      .docsify-copy-code-button {
        opacity: 0.85 !important;
      }
    }

    /* --- Haku --- */
    .search {
      margin-bottom: 10px;
    }
    .search input {
      border-radius: 10px !important;
      border: 1px solid var(--border) !important;
      background: var(--bg-elevated) !important;
      color: var(--text) !important;
    }
    .search input:focus {
      outline: none !important;
      border-color: var(--accent) !important;
    }
    .search .results-panel {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .search a { color: var(--text) !important; }
    .search .matching-post p { color: var(--text-soft) !important; }
    .search h2 { border-bottom: 1px solid var(--border); }

    /* --- Etusivu (cover) --- */
    section.cover {
      background:
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.25), transparent 45%),
        radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.2), transparent 45%),
        var(--bg) !important;
      min-height: calc(100vh - var(--header-h)) !important;
      padding: 40px 20px !important;
    }
    section.cover .cover-main {
      max-width: 920px;
      /* .cover-main on flex-item (theme asettaa flex:1), ja ilman tätä sen
         automaattinen minimileveys määräytyy sisällä olevan CSS Gridin
         (.category-grid, auto-fit+minmax) sisältöpohjaisesta minimistä, joka
         yrittää mahduttaa KAIKKI kortit yhdelle riville — tämä työnsi koko
         heron ja gridin leveämmäksi kuin näyttö kapeilla laitteilla. */
      min-width: 0;
      width: 100%;
      box-sizing: border-box;
    }
    .cover-badge {
      width: 60px;
      height: 60px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-weight: 700;
      font-size: 1.5rem;
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.35);
    }
    .cover-hero {
      font-size: 2.7rem;
      line-height: 1.18;
      font-weight: 800;
      color: var(--text);
      margin: 0 0 0.5em;
      letter-spacing: -0.01em;
    }
    .cover-hero .grad-text {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    section.cover blockquote {
      color: var(--text-soft);
      font-size: 1.1rem;
      max-width: 640px;
      margin: 0 auto 0.6em;
    }
    .cover-meta {
      color: var(--text-faint);
      font-size: 0.85rem;
      margin-top: -0.3em;
    }
    .cover-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 1.6em 0 0;
    }
    .cover-buttons a {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 10px;
      border: 1.5px solid var(--accent);
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none !important;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .cover-buttons a:first-child {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: #fff;
    }
    .cover-buttons a:hover {
      transform: translateY(-2px);
    }

    /* --- Kategoriakortit (etusivu) --- */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      max-width: 880px;
      width: 100%;
      margin: 2.2em auto;
      text-align: left;
      box-sizing: border-box;
    }
    .category-grid:empty::before {
      content: attr(data-loading);
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-faint);
      font-size: 0.85rem;
    }
    .category-card {
      display: block;
      min-width: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: 18px;
      border-radius: 14px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      text-decoration: none !important;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .category-card:hover {
      transform: translateY(-4px);
      border-color: var(--card-accent, var(--accent));
    }
    .category-card .badge {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      margin-bottom: 10px;
    }
    .category-card .head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .category-card .name {
      display: block;
      font-weight: 600;
      color: var(--text);
      font-size: 0.95rem;
    }
    .category-card .count {
      display: block;
      color: var(--text-faint);
      font-size: 0.74rem;
      white-space: nowrap;
    }
    .category-card .preview {
      list-style: none;
      margin: 10px 0 0;
      padding: 0;
    }
    .category-card .preview li {
      color: var(--text-soft);
      font-size: 0.8rem;
      line-height: 1.8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .category-card .preview li::before {
      content: '›';
      color: var(--card-accent, var(--accent));
      margin-right: 6px;
      font-weight: 700;
    }

    /* --- Esimerkkiosio (etusivu) --- */
    .showcase-label {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-faint);
      max-width: 880px;
      margin: 2.6em auto 0.8em;
      text-align: left;
    }
    .featured-example {
      max-width: 880px;
      margin: 0 auto;
      text-align: left;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--bg-elevated);
      overflow: hidden;
    }
    .featured-example:empty {
      display: none;
    }
    .featured-example .fx-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
    }
    .featured-example .fx-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }
    .featured-example .fx-lang {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-faint);
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
    }
    .featured-example .fx-copy {
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .featured-example .fx-copy:hover {
      background: var(--accent-dark);
    }
    .featured-example pre {
      margin: 0;
      max-height: 340px;
      overflow: auto;
      border: none !important;
      border-radius: 0 !important;
      background: var(--code-bg) !important;
    }
    .featured-example pre code {
      background: transparent;
      padding: 18px !important;
      display: block;
    }

    /* --- Kategoriakortin esimerkkipainike --- */
    .category-card {
      position: relative;
    }
    .category-card .preview-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      color: var(--text-faint);
      font-size: 0.8rem;
      cursor: pointer;
      opacity: 0;
      transform: translateY(-2px);
      transition: opacity 0.15s ease, transform 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .category-card:hover .preview-btn,
    .category-card:focus-visible .preview-btn {
      opacity: 1;
      transform: translateY(0);
    }
    .category-card .preview-btn:hover {
      color: var(--card-accent, var(--accent));
      border-color: var(--card-accent, var(--accent));
    }
    .category-card.is-active {
      border-color: var(--card-accent, var(--accent));
      box-shadow: 0 0 0 1px var(--card-accent, var(--accent));
    }

    /* --- Latausskeletonit (kategoriakortit + esimerkkipaneeli) --- */
    @keyframes skeleton-pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    .skeleton-card {
      height: 128px;
      border-radius: 14px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      animation: skeleton-pulse 1.4s ease-in-out infinite;
    }
    .skeleton-block {
      height: 220px;
      border-radius: 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      animation: skeleton-pulse 1.4s ease-in-out infinite;
    }

    /* --- Koodilohkon kieli-badge ---
       Docsifyn oma vue.css-teema piirtää jo kielen pre:after-pseudo-
       elementillä (content: attr(data-lang), data-lang asetetaan
       automaattisesti fenced-koodilohkon kielesta). Sen sijaan etta
       lisattaisiin PAALLEKKAINEN oma badge-elementti JS:lla (joka
       aiemmin meni koodin ensimmaisen rivin paalle), tyylitellaan
       tata valmista ankkuria nakyvammaksi "badge"-pilliksi. */
    .markdown-section pre {
      position: relative;
      padding-top: 2.4em;
    }
    .markdown-section pre:after {
      top: 0.7em !important;
      left: 0.85em !important;
      right: auto !important;
      font-size: 0.66rem !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.04em !important;
      color: var(--accent-soft, #93c5fd) !important;
      background: var(--bg-soft) !important;
      border: 1px solid var(--border) !important;
      border-radius: 6px !important;
      padding: 3px 8px !important;
      height: auto !important;
      line-height: 1.2 !important;
    }
    .markdown-section pre:not([data-lang]):after,
    .markdown-section pre[data-lang=""]:after,
    .markdown-section pre[data-lang="text"]:after {
      content: none !important;
    }

    /* --- Sivuston footer --- */
    .site-footer {
      max-width: 820px;
      margin: 4em auto 0;
      padding: 1.6em 0 0;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .site-footer .footer-note {
      color: var(--text-faint);
      font-size: 0.8rem;
    }
    .site-footer .footer-links {
      display: flex;
      gap: 16px;
    }
    .site-footer .footer-links a {
      color: var(--text-soft);
      font-size: 0.8rem;
      text-decoration: none;
      border: none !important;
    }
    .site-footer .footer-links a:hover {
      color: var(--accent);
    }

    /* --- Tags-sivun tagipilvi --- */
    .tag-cloud-wrap {
      margin: 0 0 2em;
    }
    .tag-cloud-filter {
      width: 100%;
      max-width: 320px;
      margin: 0 0 12px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      font-size: 0.85rem;
      font-family: inherit;
    }
    .tag-cloud-filter:focus {
      outline: none;
      border-color: var(--accent);
    }
    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-soft) !important;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none !important;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .tag-chip:hover {
      color: #fff !important;
      background: var(--accent);
      border-color: var(--accent);
    }
    .tag-chip .tag-chip-count {
      color: var(--text-faint);
      font-weight: 400;
      font-size: 0.72rem;
    }
    .tag-chip:hover .tag-chip-count {
      color: rgba(255, 255, 255, 0.8);
    }
    .tag-chip.tag-chip-lg { font-size: 0.95rem; padding: 7px 15px; }
    .tag-chip.tag-chip-hidden { display: none; }

    /* --- Sivutus (pagination) --- */
    .pagination-item-label {
      color: var(--text-faint);
    }
    .pagination-item-title {
      color: var(--accent);
    }

    /* --- Mobiili --- */
    @media (max-width: 768px) {
      .markdown-section {
        padding: 20px 20px 60px;
      }
      .category-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .cover-hero {
        font-size: 2rem;
      }
      section.cover blockquote {
        font-size: 1rem;
      }
      #site-header .links {
        gap: 10px;
      }
    }

    @media (max-width: 480px) {
      section.cover {
        padding: 32px 14px !important;
      }
      .cover-hero {
        font-size: 1.6rem;
      }
      .category-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .category-card {
        padding: 14px;
      }
      .cover-buttons {
        flex-direction: column;
        align-items: stretch;
      }
      .cover-buttons a {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header id="site-header">
    <a class="brand" href="#/">
      <span class="logo-badge">{ }</span>
      <span>All-Code Cheat Sheet</span>
    </a>
    <div class="links">
      <a class="ghlink" href="https://github.com/PennasenKake/All-Code_Cheat_Sheet" target="_blank" rel="noopener">GitHub</a>
    </div>
  </header>
  <div id="app">Ladataan…</div>
  <script>
    window.$docsify = {
      name: 'All-Code Cheat Sheet',
      repo: 'PennasenKake/All-Code_Cheat_Sheet',
      loadSidebar: '_sidebar.md',
      coverpage: '_coverpage.md',
      onlyCover: false,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      loadNavbar: false,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Hae muistilapuista…',
        noData: 'Ei tuloksia.',
        depth: 4,
      },
      copyCode: {
        buttonText: 'Kopioi',
        errorText: 'Virhe',
        successText: 'Kopioitu',
      },
      pagination: {
        crossChapter: true,
        crossChapterText: true,
      },
      formatUpdated: '{MM}/{DD}/{YYYY}',
      plugins: [
        function (hook) {
          // suurenna kuvat klikkaamalla (medium-zoom), ladattu erikseen alla
          hook.doneEach(function () {
            if (window.mediumZoom) {
              window.mediumZoom('.markdown-section img', {
                background: 'rgba(9, 9, 11, 0.9)',
              });
            }
          });
        },
        function (hook) {
          // etusivun kategoriakortit + esimerkkipaneeli: luetaan categories.json
          // ja renderöidään kortit suoraan selaimessa, jotta ne pysyvät aina
          // ajan tasalla. Kortin klikkaus vie kategorian omaan osioon
          // README:ssa; pieni silmä-painike kortin kulmassa sen sijaan
          // hakee ja näyttää kategorian esimerkin alla olevassa paneelissa
          // ilman sivulta poistumista.
          function hexToRgba(hex, alpha) {
            var h = hex.replace('#', '');
            var r = parseInt(h.substring(0, 2), 16);
            var g = parseInt(h.substring(2, 4), 16);
            var b = parseInt(h.substring(4, 6), 16);
            return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
          }

          function escapeHtml(s) {
            return String(s).replace(/[&<>]/g, function (c) {
              return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
            });
          }

          function skeletonCards(n) {
            var out = '';
            for (var i = 0; i < n; i++) out += '<div class="skeleton-card"></div>';
            return out;
          }

          function showFeaturedExample(box, path, label) {
            box.classList.add('is-loading');
            box.innerHTML = '<div class="skeleton-block"></div>';
            fetch(path)
              .then(function (r) { return r.text(); })
              .then(function (text) {
                var m = text.match(/```+([a-z0-9]*)\n([\s\S]*?)\n```+/i);
                var lang = (m && m[1]) ? m[1].toLowerCase() : 'text';
                var code = m ? m[2] : text;
                var codeEl = document.createElement('code');
                codeEl.className = 'language-' + lang;
                codeEl.textContent = code;
                var pre = document.createElement('pre');
                pre.appendChild(codeEl);

                box.innerHTML =
                  '<div class="fx-head">' +
                    '<span class="fx-title">' + escapeHtml(label) +
                      '<span class="fx-lang">' + escapeHtml(lang) + '</span>' +
                    '</span>' +
                    '<button type="button" class="fx-copy">Kopioi koodi</button>' +
                  '</div>';
                box.appendChild(pre);

                if (window.Prism) {
                  window.Prism.highlightElement(codeEl);
                }

                var btn = box.querySelector('.fx-copy');
                btn.addEventListener('click', function () {
                  navigator.clipboard.writeText(code).then(function () {
                    btn.textContent = 'Kopioitu!';
                    setTimeout(function () { btn.textContent = 'Kopioi koodi'; }, 1500);
                  });
                });
              })
              .catch(function () {
                box.innerHTML = '';
              })
              .finally(function () {
                box.classList.remove('is-loading');
              });
          }
          hook.doneEach(function () {
            var grid = document.getElementById('category-grid');
            var box = document.getElementById('featured-example');
            if (!grid || grid.dataset.loaded) return;
            grid.dataset.loaded = '1';
            grid.innerHTML = skeletonCards(9);
            if (box) box.innerHTML = '<div class="skeleton-block"></div>';

            fetch('categories.json')
              .then(function (r) { return r.json(); })
              .then(function (categories) {
                grid.innerHTML = categories.map(function (c, i) {
                  var preview = (c.preview || []).map(function (t) {
                    return '<li>' + escapeHtml(t) + '</li>';
                  }).join('');
                  return '<a class="category-card' + (i === 0 ? ' is-active' : '') + '" data-idx="' + i +
                    '" href="' + c.href + '" style="--card-accent:' + c.color + '">' +
                    '<button type="button" class="preview-btn" data-example="' + escapeHtml(c.example) +
                      '" data-label="' + escapeHtml(c.example_title || c.display) +
                      '" title="Näytä esimerkki ' + escapeHtml(c.display) + '-kategoriasta">&#128065;</button>' +
                    '<span class="badge" style="color:' + c.color + ';background:' + hexToRgba(c.color, 0.16) + '">' + c.badge + '</span>' +
                    '<span class="head"><span class="name">' + c.display + '</span>' +
                    '<span class="count">' + c.count + ' tiedostoa</span></span>' +
                    '<ul class="preview">' + preview + '</ul>' +
                    '</a>';
                }).join('');

                grid.querySelectorAll('.preview-btn').forEach(function (btn) {
                  btn.addEventListener('click', function (ev) {
                    ev.preventDefault();
                    ev.stopPropagation();
                    grid.querySelectorAll('.category-card').forEach(function (el) {
                      el.classList.remove('is-active');
                    });
                    btn.closest('.category-card').classList.add('is-active');
                    if (box) showFeaturedExample(box, btn.dataset.example, btn.dataset.label);
                  });
                });

                if (box && categories.length) {
                  showFeaturedExample(box, categories[0].example, categories[0].example_title || categories[0].display);
                }
              })
              .catch(function () {
                grid.dataset.loaded = '';
                grid.innerHTML = '';
              });
          });
        },
        function (hook) {
          // sivuston footer: lisätään jokaisen sisältösivun loppuun renderöidyn
          // markdownin perään (afterEach ei laukea coverpagelle, jolla on jo
          // omat linkkinsä, joten ehdollista tarkistusta ei tarvita)
          hook.afterEach(function (html, next) {
            html +=
              '<footer class="site-footer">' +
                '<span class="footer-note">Sivusto päivittyy automaattisesti aina kun repoon pushataan.</span>' +
                '<span class="footer-links">' +
                  '<a href="#/README">Sisällysluettelo</a>' +
                  '<a href="#/tags">Tunnisteet</a>' +
                  '<a href="https://github.com/PennasenKake/All-Code_Cheat_Sheet" target="_blank" rel="noopener">GitHub</a>' +
                '</span>' +
              '</footer>';
            next(html);
          });
        },
        function (hook) {
          // tags.md: visuaalinen tagipilvi + tekstisuodatin sivun ylälaitaan
          hook.doneEach(function () {
            if (!/\/tags([?#]|$)/.test(window.location.hash)) return;
            var section = document.querySelector('.markdown-section');
            if (!section || section.dataset.tagCloudLoaded) return;
            section.dataset.tagCloudLoaded = '1';

            fetch('tags.json')
              .then(function (r) { return r.json(); })
              .then(function (tags) {
                var max = tags.reduce(function (m, t) { return Math.max(m, t.count); }, 1);
                var wrap = document.createElement('div');
                wrap.className = 'tag-cloud-wrap';
                var input = document.createElement('input');
                input.type = 'search';
                input.className = 'tag-cloud-filter';
                input.placeholder = 'Suodata tunnisteita…';
                var cloud = document.createElement('div');
                cloud.className = 'tag-cloud';
                cloud.innerHTML = tags.map(function (t) {
                  var big = t.count >= max * 0.5 ? ' tag-chip-lg' : '';
                  return '<a class="tag-chip' + big + '" data-tag="' + t.tag.toLowerCase() + '" href="' + t.anchor + '">' +
                    t.tag + ' <span class="tag-chip-count">' + t.count + '</span></a>';
                }).join('');
                wrap.appendChild(input);
                wrap.appendChild(cloud);
                var firstHeading = section.querySelector('h1');
                if (firstHeading && firstHeading.nextSibling) {
                  firstHeading.parentNode.insertBefore(wrap, firstHeading.nextSibling.nextSibling || null);
                } else {
                  section.insertBefore(wrap, section.firstChild);
                }

                input.addEventListener('input', function () {
                  var q = input.value.trim().toLowerCase();
                  cloud.querySelectorAll('.tag-chip').forEach(function (chip) {
                    var match = !q || chip.dataset.tag.indexOf(q) !== -1;
                    chip.classList.toggle('tag-chip-hidden', !match);
                  });
                });
              })
              .catch(function () {
                section.dataset.tagCloudLoaded = '';
              });
          });
        },
      ],
    };
  </script>
