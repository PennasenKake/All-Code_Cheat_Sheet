<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <script>
    // Luetaan tallennettu teemavalinta ja asetetaan se HETI (ennen CSS:n
    // lataamista / minkaan renderoitumista), jotta sivu ei vilku vaarassa
    // teemassa ennen JS:n ehtimista ajaa myohemmin.
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {}
    })();
  </script>
  <title>All-Code Cheat Sheet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <meta name="description" content="Koodin muistilappuja ja esimerkkejä usealle eri kielelle, suomeksi." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />
  <style>
    :root {
      --accent: #6366f1;
      --accent-2: #a855f7;
      --accent-dark: #4f46e5;
      --bg: #09090b;
      --bg-soft: #131316;
      --bg-elevated: #18181b;
      --text: #f4f4f5;
      --text-soft: #a1a1aa;
      --text-faint: #71717a;
      --border: #27272a;
      --code-bg: #131316;
      --theme-color: var(--accent);
      --header-h: 60px;
      --header-bg: rgba(9, 9, 11, 0.72);
    }

    /* Vaalea teema kolmella tavalla, jotta manuaalinen valitsin voittaa
       aina järjestelmäasetuksen: (1) järjestelmä suosii vaaleaa EIKÄ
       käyttäjä ole pakottanut tummaa, (2) käyttäjä on pakottanut vaalean
       riippumatta järjestelmästä. Manuaalinen tumma-pakotus (3) tarvitaan
       koska muuten järjestelmän vaalea-asetus voittaisi tumman valinnan. */
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #ffffff;
        --bg-soft: #f6f6f8;
        --bg-elevated: #ffffff;
        --text: #18181b;
        --text-soft: #52525b;
        --text-faint: #8a8a93;
        --border: #e4e4e7;
        --code-bg: #f6f6f8;
        --header-bg: rgba(255, 255, 255, 0.72);
      }
    }
    :root[data-theme="light"] {
      --bg: #ffffff;
      --bg-soft: #f6f6f8;
      --bg-elevated: #ffffff;
      --text: #18181b;
      --text-soft: #52525b;
      --text-faint: #8a8a93;
      --border: #e4e4e7;
      --code-bg: #f6f6f8;
      --header-bg: rgba(255, 255, 255, 0.72);
    }
    #site-header .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-soft);
      cursor: pointer;
      flex-shrink: 0;
    }
    #site-header .theme-toggle:hover {
      color: var(--text);
      border-color: var(--accent);
    }
    #site-header .theme-toggle svg {
      width: 16px;
      height: 16px;
    }
    #site-header .theme-toggle .icon-moon { display: none; }
    :root[data-theme="light"] #site-header .theme-toggle .icon-sun { display: none; }
    :root[data-theme="light"] #site-header .theme-toggle .icon-moon { display: block; }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) #site-header .theme-toggle .icon-sun { display: none; }
      :root:not([data-theme="dark"]) #site-header .theme-toggle .icon-moon { display: block; }
    }

    /* Docsifyn oma github-corner-nauha (oikea ylänurkka) poistettu kaytosta:
       #site-header sisaltaa jo oman siistin "GitHub"-linkin, ja nauha
       limittyi sen kanssa (nakyi paallekkaisena/dublikaattina). */
    .github-corner {
      display: none !important;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      color: var(--text);
    }

    pre, code, kbd {
      font-family: 'JetBrains Mono', "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace !important;
    }

    /* --- Yläpalkki (kiinteä, kaikilla sivuilla) --- */
    #site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    #site-header .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      text-decoration: none !important;
    }
    #site-header .brand .logo-badge {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    #site-header .links {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    #site-header a.ghlink {
      color: var(--text-soft);
      font-size: 0.85rem;
      text-decoration: none !important;
      transition: color 0.15s ease;
    }
    #site-header a.ghlink:hover {
      color: var(--accent);
    }

    /* --- Sivupalkki --- */
    .sidebar {
      background: var(--bg-soft);
      border-right: 1px solid var(--border);
      top: var(--header-h) !important;
      height: calc(100vh - var(--header-h)) !important;
    }
    .content {
      padding-top: var(--header-h);
    }
    .sidebar-nav a {
      color: var(--text-soft);
      border-radius: 8px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .sidebar-nav a:hover {
      color: var(--text);
      background: var(--bg-elevated);
    }
    .sidebar-nav li.active > a {
      color: #fff;
      font-weight: 600;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }
    .sidebar-nav > ul > li > a {
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0.01em;
      color: var(--text);
    }
    .sidebar ul li ul {
      border-left: 1px solid var(--border);
      margin-left: 8px;
      padding-left: 4px;
    }
    .sidebar-nav strong, .app-name-link {
      color: var(--text) !important;
    }

    /* --- Sisältöalue --- */
    .markdown-section {
      max-width: 820px;
      padding: 30px 40px 80px;
    }
    .markdown-section h1 {
      font-size: 2.1rem;
      font-weight: 800;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.4em;
    }
    .markdown-section h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 2.2em;
      padding-top: 0.4em;
      border-top: 1px solid var(--border);
    }
    .markdown-section h3 {
      font-weight: 700;
      margin-top: 2em;
    }
    .markdown-section p, .markdown-section li {
      line-height: 1.7;
      color: var(--text);
    }
    .markdown-section a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(99, 102, 241, 0.35);
    }
    .markdown-section a:hover {
      border-bottom-color: var(--accent);
    }
    /* Docsifyn otsikoiden automaattiset itse-linkki-ankkurit (a.anchor)
       eivät saa näyttää samalta kuin tavalliset tekstilinkit - muuten
       jokainen otsikko (H1-H6) näyttää rikkinäiseltä/alleviivatulta
       linkiltä, vaikka se ei ole tavallinen sisältölinkki. */
    .markdown-section h1 a.anchor,
    .markdown-section h2 a.anchor,
    .markdown-section h3 a.anchor,
    .markdown-section h4 a.anchor,
    .markdown-section h5 a.anchor,
    .markdown-section h6 a.anchor {
      color: inherit;
      border-bottom: none;
    }
    .markdown-section h1 a.anchor:hover,
    .markdown-section h2 a.anchor:hover,
    .markdown-section h3 a.anchor:hover,
    .markdown-section h4 a.anchor:hover,
    .markdown-section h5 a.anchor:hover,
    .markdown-section h6 a.anchor:hover {
      color: var(--accent);
    }
    /* Kategoriabadge README:n ### -otsikoiden eteen (ks. plugins-taulukon
       viimeisin hook) - sama väri/lyhenne kuin etusivun kategoriakortissa. */
    .cat-heading-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.6em;
      height: 1.6em;
      padding: 0 0.35em;
      margin-right: 0.5em;
      border-radius: 7px;
      font-size: 0.62em;
      font-weight: 800;
      vertical-align: middle;
      background: var(--bg-elevated);
    }

    /* --- Koodilohkot --- */
    .markdown-section pre {
      background: var(--code-bg) !important;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .markdown-section code {
      background: var(--bg-elevated);
      border-radius: 5px;
      padding: 0.15em 0.4em;
      font-size: 0.85em;
    }
    .markdown-section pre > code {
      padding: 0;
      background: transparent;
    }
    .docsify-copy-code-button {
      background: var(--bg-elevated) !important;
      border: 1px solid var(--border) !important;
      color: var(--text-soft) !important;
      border-radius: 6px !important;
      /* aiemmin nakymatta ennen hoveria (opacity:0) - kosketuslaitteilla
         "hover" ei koskaan laukea, joten nappi ei nakynyt ollenkaan.
         Nyt aina lievasti nakyvissa ja taysin nakyva hoverissa/fokuksessa. */
      opacity: 0.55 !important;
    }
    .markdown-section pre:hover .docsify-copy-code-button,
    .docsify-copy-code-button:hover,
    .docsify-copy-code-button:focus {
      opacity: 1 !important;
      color: #fff !important;
      background: var(--accent) !important;
      border-color: var(--accent) !important;
    }
    @media (hover: none) {
      .docsify-copy-code-button {
        opacity: 0.85 !important;
      }
    }

    /* --- Haku --- */
    .search {
      margin-bottom: 10px;
    }
    .search input {
      border-radius: 10px !important;
      border: 1px solid var(--border) !important;
      background: var(--bg-elevated) !important;
      color: var(--text) !important;
    }
    .search input:focus {
      outline: none !important;
      border-color: var(--accent) !important;
    }
    .search .results-panel {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .search a { color: var(--text) !important; }
    .search .matching-post p { color: var(--text-soft) !important; }
    .search h2 { border-bottom: 1px solid var(--border); }

    /* --- Etusivu (cover) --- */
    section.cover {
      background:
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.25), transparent 45%),
        radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.2), transparent 45%),
        var(--bg) !important;
      min-height: calc(100vh - var(--header-h)) !important;
      /* section.cover EI ole .content-elementin sisällä (jolla on
         padding-top: var(--header-h) kiinteän headerin varalle) - se on
         oma erillinen lohkonsa joka alkaa suoraan y:0:sta. Ilman omaa
         yläreunan tilaa kiinteä #site-header (60px, z-index:200) peitti
         aaltosulku-badgen ja hero-otsikon yläosan. */
      padding: calc(var(--header-h) + 40px) 20px 40px !important;
    }
    section.cover .cover-main {
      max-width: 920px;
      /* .cover-main on flex-item (theme asettaa flex:1), ja ilman tätä sen
         automaattinen minimileveys määräytyy sisällä olevan CSS Gridin
         (.category-grid, auto-fit+minmax) sisältöpohjaisesta minimistä, joka
         yrittää mahduttaa KAIKKI kortit yhdelle riville — tämä työnsi koko
         heron ja gridin leveämmäksi kuin näyttö kapeilla laitteilla. */
      min-width: 0;
      width: 100%;
      box-sizing: border-box;
      /* teeman oma .cover-main on flex-itemi jolla flex:1 (kasvaa
         täyttämään koko section.cover:in leveyden) - kun max-width
         rajoittaa sen 920px:iin, ilman margin:autoa jaama tila jää
         KOKONAAN oikealle puolelle (section.cover ei aseta
         justify-content:centeriä), jolloin koko etusivun sisältö
         näyttää olevan työnnetty vasempaan laitaan leveillä näytöillä.
         margin:0 auto keskittää flex-itemin symmetrisesti. */
      margin: 0 auto;
    }
    .cover-badge {
      width: 60px;
      height: 60px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-weight: 700;
      font-size: 1.5rem;
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.35);
    }
    .cover-hero {
      font-size: 2.7rem;
      line-height: 1.18;
      font-weight: 800;
      color: var(--text);
      margin: 0 0 0.5em;
      letter-spacing: -0.01em;
    }
    .cover-hero .grad-text {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    section.cover blockquote {
      color: var(--text-soft);
      font-size: 1.1rem;
      max-width: 640px;
      margin: 0 auto 0.6em;
    }
    .cover-meta {
      color: var(--text-faint);
      font-size: 0.85rem;
      margin-top: -0.3em;
    }
    /* Etusivun oma hakukenttä - näkyy heti heron alla ilman scrollausta.
       Docsifyn oma haku (sivupalkissa) on muuten piilossa aloitusnäytöllä,
       koska coverpage on koko ruudun korkuinen eikä sivupalkki tule
       "sticky"-tilaan ennen kuin sen on scrollannut ohi (Docsifyn oma
       ominaisuus). Tämä kenttä käyttää silti AINA samaa oikeaa
       hakuindeksiä - syöte peilataan sivupalkin kenttään ja tulokset
       kopioidaan takaisin tähän (ks. plugins-taulukko). */
    .cover-search-wrap {
      position: relative;
      max-width: 480px;
      width: 100%;
      margin: 1.4em auto 0;
    }
    .cover-search-input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .cover-search-input::placeholder {
      color: var(--text-faint);
    }
    .cover-search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
    }
    .cover-search-results {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 8px);
      z-index: 30;
      max-height: 360px;
      overflow-y: auto;
      text-align: left;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
      padding: 6px;
    }
    .cover-search-results.has-results {
      display: block;
    }
    .cover-search-results .matching-post {
      border-bottom: 1px solid var(--border);
    }
    .cover-search-results .matching-post:last-child {
      border-bottom: none;
    }
    .cover-search-results .matching-post a {
      display: block;
      padding: 9px 10px;
      border-radius: 8px;
      text-decoration: none !important;
    }
    .cover-search-results .matching-post a:hover {
      background: var(--bg-soft);
    }
    .cover-search-results .matching-post h2 {
      margin: 0 0 2px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
    }
    .cover-search-results .matching-post p {
      margin: 0;
      font-size: 0.78rem;
      color: var(--text-faint);
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .cover-search-results .app-name.hide,
    .cover-search-results .sidebar-nav.hide {
      display: none;
    }
    .cover-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 1.6em 0 0;
    }
    .cover-buttons a {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 10px;
      border: 1.5px solid var(--accent);
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none !important;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .cover-buttons a:first-child {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: #fff;
    }
    .cover-buttons a:hover {
      transform: translateY(-2px);
    }

    /* --- Kategoriakortit (etusivu) --- */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      max-width: 880px;
      width: 100%;
      margin: 2.2em auto;
      text-align: left;
      box-sizing: border-box;
    }
    .category-grid:empty::before {
      content: attr(data-loading);
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-faint);
      font-size: 0.85rem;
    }
    /* Visuaalinen ryhmäotsikko kategoriakorttien välissä (Kielet /
       Työkalut & kaavat / Muu) - kansiorakenne ei muutu, tämä on vain
       etusivun kortit järjestävä otsikko samassa gridissä. */
    .category-group-heading {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-faint);
      margin: 1.4em 0 -0.2em;
      padding-top: 1em;
      border-top: 1px solid var(--border);
    }
    .category-group-heading::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--group-accent, var(--accent));
      flex-shrink: 0;
    }
    .category-group-heading:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }
    .category-card {
      display: block;
      min-width: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: 18px;
      border-radius: 14px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      text-decoration: none !important;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .category-card:hover {
      transform: translateY(-4px);
      border-color: var(--card-accent, var(--accent));
    }
    .category-card .badge {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      margin-bottom: 10px;
    }
    .category-card .head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .category-card .name {
      display: block;
      font-weight: 600;
      color: var(--text);
      font-size: 0.95rem;
    }
    .category-card .count {
      display: block;
      color: var(--text-faint);
      font-size: 0.74rem;
      white-space: nowrap;
    }
    .category-card .preview {
      list-style: none;
      margin: 10px 0 0;
      padding: 0;
    }
    .category-card .preview li {
      color: var(--text-soft);
      font-size: 0.8rem;
      line-height: 1.8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .category-card .preview li::before {
      content: '›';
      color: var(--card-accent, var(--accent));
      margin-right: 6px;
      font-weight: 700;
    }

    /* --- Esimerkkiosio (etusivu) --- */
    .showcase-label {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-faint);
      max-width: 880px;
      margin: 2.6em auto 0.8em;
      text-align: left;
    }
    .featured-example {
      max-width: 880px;
      margin: 0 auto;
      text-align: left;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--bg-elevated);
      overflow: hidden;
    }
    .featured-example:empty {
      display: none;
    }
    .featured-example .fx-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
    }
    .featured-example .fx-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }
    .featured-example .fx-lang {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-faint);
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
    }
    .featured-example .fx-copy {
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .featured-example .fx-copy:hover {
      background: var(--accent-dark);
    }
    .featured-example pre {
      margin: 0;
      max-height: 340px;
      overflow: auto;
      border: none !important;
      border-radius: 0 !important;
      background: var(--code-bg) !important;
    }
    .featured-example pre code {
      background: transparent;
      padding: 18px !important;
      display: block;
    }

    /* --- Kategoriakortin esimerkkipainike --- */
    .category-card {
      position: relative;
    }
    .category-card .preview-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      color: var(--text-faint);
      font-size: 0.8rem;
      cursor: pointer;
      opacity: 0;
      transform: translateY(-2px);
      transition: opacity 0.15s ease, transform 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .category-card:hover .preview-btn,
    .category-card:focus-visible .preview-btn {
      opacity: 1;
      transform: translateY(0);
    }
    .category-card .preview-btn:hover {
      color: var(--card-accent, var(--accent));
      border-color: var(--card-accent, var(--accent));
    }
    .category-card.is-active {
      border-color: var(--card-accent, var(--accent));
      box-shadow: 0 0 0 1px var(--card-accent, var(--accent));
    }

    /* --- Latausskeletonit (kategoriakortit + esimerkkipaneeli) --- */
    @keyframes skeleton-pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    .skeleton-card {
      height: 128px;
      border-radius: 14px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      animation: skeleton-pulse 1.4s ease-in-out infinite;
    }
    .skeleton-block {
      height: 220px;
      border-radius: 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      animation: skeleton-pulse 1.4s ease-in-out infinite;
    }

    /* --- Koodilohkon kieli-badge ---
       Docsifyn oma vue.css-teema piirtää jo kielen pre:after-pseudo-
       elementillä (content: attr(data-lang), data-lang asetetaan
       automaattisesti fenced-koodilohkon kielesta). Sen sijaan etta
       lisattaisiin PAALLEKKAINEN oma badge-elementti JS:lla (joka
       aiemmin meni koodin ensimmaisen rivin paalle), tyylitellaan
       tata valmista ankkuria nakyvammaksi "badge"-pilliksi. */
    .markdown-section pre {
      position: relative;
      padding-top: 2.4em;
    }
    .markdown-section pre:after {
      top: 0.7em !important;
      left: 0.85em !important;
      right: auto !important;
      font-size: 0.66rem !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.04em !important;
      color: var(--accent-soft, #93c5fd) !important;
      background: var(--bg-soft) !important;
      border: 1px solid var(--border) !important;
      border-radius: 6px !important;
      padding: 3px 8px !important;
      height: auto !important;
      line-height: 1.2 !important;
    }
    .markdown-section pre:not([data-lang]):after,
    .markdown-section pre[data-lang=""]:after,
    .markdown-section pre[data-lang="text"]:after {
      content: none !important;
    }

    /* --- Sivuston footer --- */
    .site-footer {
      max-width: 820px;
      margin: 4em auto 0;
      padding: 1.6em 0 2em;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .site-footer .footer-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .site-footer .footer-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      color: var(--text-faint);
      font-size: 0.78rem;
    }
    .site-footer .footer-meta .dot {
      opacity: 0.6;
    }
    .site-footer .footer-note {
      color: var(--text-faint);
      font-size: 0.8rem;
    }
    .site-footer .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    .site-footer .footer-links a {
      color: var(--text-soft);
      font-size: 0.8rem;
      text-decoration: none;
      border: none !important;
      background: none !important;
      cursor: pointer;
    }
    .site-footer .footer-links a:hover {
      color: var(--accent);
    }

    /* --- Tags-sivun tagipilvi --- */
    .tag-cloud-wrap {
      margin: 0 0 2em;
    }
    .tag-cloud-filter {
      width: 100%;
      max-width: 320px;
      margin: 0 0 12px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      font-size: 0.85rem;
      font-family: inherit;
    }
    .tag-cloud-filter:focus {
      outline: none;
      border-color: var(--accent);
    }
    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-soft) !important;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none !important;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .tag-chip:hover {
      color: #fff !important;
      background: var(--accent);
      border-color: var(--accent);
    }
    .tag-chip .tag-chip-count {
      color: var(--text-faint);
      font-weight: 400;
      font-size: 0.72rem;
    }
    .tag-chip:hover .tag-chip-count {
      color: rgba(255, 255, 255, 0.8);
    }
    .tag-chip.tag-chip-lg { font-size: 0.95rem; padding: 7px 15px; }
    .tag-chip.tag-chip-hidden { display: none; }

    /* --- Tags-sivun kategoriasuodatin --- */
    .tag-cat-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 14px;
    }
    .tag-cat-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-soft);
      font-size: 0.78rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .tag-cat-btn .dotcolor {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .tag-cat-btn:hover {
      color: var(--text);
      border-color: var(--text-soft);
    }
    .tag-cat-btn.is-active {
      color: #fff;
      background: var(--cat-color, var(--accent));
      border-color: var(--cat-color, var(--accent));
    }

    /* --- Sisältösivun omat tagichipit (otsikon alla) --- */
    .page-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: -0.6em 0 1.6em;
    }
    .page-tags a.tag-chip {
      font-size: 0.72rem;
      padding: 3px 10px;
    }

    /* --- "Aiheeseen liittyvät" sisältösivun lopussa --- */
    .related-pages {
      margin: 2.5em 0 1em;
      padding-top: 1.4em;
      border-top: 1px solid var(--border);
    }
    .related-pages-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-faint);
      margin: 0 0 0.7em;
    }
    .related-pages-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 6px 16px;
    }
    .related-pages-list a {
      display: block;
      padding: 6px 0;
      font-size: 0.88rem;
      font-weight: 600;
      border-bottom: none !important;
    }
    .related-pages-list a:before {
      content: '→ ';
      color: var(--accent);
    }

    /* --- Etusivun pikavalinnat --- */
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 1em 0 0;
    }
    .quick-actions a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-soft) !important;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none !important;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .quick-actions a:hover {
      color: var(--text) !important;
      border-color: var(--accent);
    }

    /* --- Sivutus (pagination) --- */
    .pagination-item-label {
      color: var(--text-faint);
    }
    .pagination-item-title {
      color: var(--accent);
    }

    /* --- Mobiili --- */
    @media (max-width: 768px) {
      .markdown-section {
        padding: 20px 20px 60px;
      }
      .category-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .cover-hero {
        font-size: 2rem;
      }
      section.cover blockquote {
        font-size: 1rem;
      }
      #site-header .links {
        gap: 10px;
      }
    }

    @media (max-width: 480px) {
      section.cover {
        padding: calc(var(--header-h) + 32px) 14px 32px !important;
      }
      .cover-hero {
        font-size: 1.6rem;
      }
      .category-grid {
        /* Yksi sarake kapeimmilla näytöillä - kaksi saraketta oli liian
           ahdas (esikatselurivit typistyivät), yksi sarake on selkeämpi. */
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .category-card {
        padding: 14px;
      }
      .cover-buttons {
        flex-direction: column;
        align-items: stretch;
      }
      .cover-buttons a {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header id="site-header">
    <a class="brand" href="#/">
      <span class="logo-badge">{ }</span>
      <span>All-Code Cheat Sheet</span>
    </a>
    <div class="links">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Vaihda tumma/vaalea teema" title="Vaihda tumma/vaalea teema">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <a class="ghlink" href="https://github.com/PennasenKake/All-Code_Cheat_Sheet" target="_blank" rel="noopener">GitHub</a>
    </div>
  </header>
  <div id="app">Ladataan…</div>
  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      function systemPrefersLight() {
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      }
      function currentTheme() {
        var explicit = document.documentElement.getAttribute('data-theme');
        if (explicit === 'light' || explicit === 'dark') return explicit;
        return systemPrefersLight() ? 'light' : 'dark';
      }
      btn.addEventListener('click', function () {
        var next = currentTheme() === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();
  </script>
  <script>
    window.$docsify = {
      name: 'All-Code Cheat Sheet',
      repo: 'PennasenKake/All-Code_Cheat_Sheet',
      loadSidebar: '_sidebar.md',
      coverpage: '_coverpage.md',
      onlyCover: false,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      loadNavbar: false,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Hae muistilapuista…',
        noData: 'Ei tuloksia.',
        depth: 4,
      },
      copyCode: {
        buttonText: 'Kopioi',
        errorText: 'Virhe',
        successText: 'Kopioitu',
      },
      pagination: {
        crossChapter: true,
        crossChapterText: true,
      },
      formatUpdated: '{MM}/{DD}/{YYYY}',
      plugins: [
        function (hook) {
          // suurenna kuvat klikkaamalla (medium-zoom), ladattu erikseen alla
          hook.doneEach(function () {
            if (window.mediumZoom) {
              window.mediumZoom('.markdown-section img', {
                background: 'rgba(9, 9, 11, 0.9)',
              });
            }
          });
        },
        function (hook) {
          // etusivun kategoriakortit + esimerkkipaneeli: luetaan categories.json
          // ja renderöidään kortit suoraan selaimessa, jotta ne pysyvät aina
          // ajan tasalla. Kortin klikkaus vie kategorian omaan osioon
          // README:ssa; pieni silmä-painike kortin kulmassa sen sijaan
          // hakee ja näyttää kategorian esimerkin alla olevassa paneelissa
          // ilman sivulta poistumista.
          function hexToRgba(hex, alpha) {
            var h = hex.replace('#', '');
            var r = parseInt(h.substring(0, 2), 16);
            var g = parseInt(h.substring(2, 4), 16);
            var b = parseInt(h.substring(4, 6), 16);
            return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
          }

          function escapeHtml(s) {
            return String(s).replace(/[&<>]/g, function (c) {
              return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
            });
          }

          function skeletonCards(n) {
            var out = '';
            for (var i = 0; i < n; i++) out += '<div class="skeleton-card"></div>';
            return out;
          }

          function showFeaturedExample(box, path, label) {
            box.classList.add('is-loading');
            box.innerHTML = '<div class="skeleton-block"></div>';
            fetch(path)
              .then(function (r) { return r.text(); })
              .then(function (text) {
                var m = text.match(/```+([a-z0-9]*)\n([\s\S]*?)\n```+/i);
                var lang = (m && m[1]) ? m[1].toLowerCase() : 'text';
                var code = m ? m[2] : text;
                var codeEl = document.createElement('code');
                codeEl.className = 'language-' + lang;
                codeEl.textContent = code;
                var pre = document.createElement('pre');
                pre.appendChild(codeEl);

                box.innerHTML =
                  '<div class="fx-head">' +
                    '<span class="fx-title">' + escapeHtml(label) +
                      '<span class="fx-lang">' + escapeHtml(lang) + '</span>' +
                    '</span>' +
                    '<button type="button" class="fx-copy">Kopioi koodi</button>' +
                  '</div>';
                box.appendChild(pre);

                if (window.Prism) {
                  window.Prism.highlightElement(codeEl);
                }

                var btn = box.querySelector('.fx-copy');
                btn.addEventListener('click', function () {
                  navigator.clipboard.writeText(code).then(function () {
                    btn.textContent = 'Kopioitu!';
                    setTimeout(function () { btn.textContent = 'Kopioi koodi'; }, 1500);
                  });
                });
              })
              .catch(function () {
                box.innerHTML = '';
              })
              .finally(function () {
                box.classList.remove('is-loading');
              });
          }
          hook.doneEach(function () {
            var grid = document.getElementById('category-grid');
            var box = document.getElementById('featured-example');
            if (!grid || grid.dataset.loaded) return;
            grid.dataset.loaded = '1';
            grid.innerHTML = skeletonCards(9);
            if (box) box.innerHTML = '<div class="skeleton-block"></div>';

            fetch('categories.json')
              .then(function (r) { return r.json(); })
              .then(function (categories) {
                var lastGroup = null;
                // Ryhmätason aksenttiväri (Kielet/Työkalut & kaavat/Muu) -
                // erottaa ryhmät toisistaan yhdellä silmäyksellä, yksittäisten
                // kategorioiden omien värien lisäksi.
                var GROUP_COLOR = {
                  'Kielet': '#6366f1',
                  'Työkalut & kaavat': '#22c55e',
                  'Muu': '#ec4899',
                };
                // Arvotaan yksi kategoria kerrallaan sivun latauksesta, jotta
                // "Esimerkki hakemistosta" -paneeli ei nayta aina samaa
                // (esim. Bash) sisaltoa, vaan vaihtelee joka lataus kerralla.
                var featuredIdx = categories.length ? Math.floor(Math.random() * categories.length) : 0;
                grid.innerHTML = categories.map(function (c, i) {
                  var preview = (c.preview || []).map(function (t) {
                    return '<li>' + escapeHtml(t) + '</li>';
                  }).join('');
                  var heading = '';
                  if (c.group && c.group !== lastGroup) {
                    var groupColor = GROUP_COLOR[c.group] || 'var(--accent)';
                    heading = '<h3 class="category-group-heading" style="--group-accent:' + groupColor + '">' +
                      escapeHtml(c.group) + '</h3>';
                    lastGroup = c.group;
                  }
                  return heading +
                    '<a class="category-card' + (i === featuredIdx ? ' is-active' : '') + '" data-idx="' + i +
                    '" href="' + c.href + '" style="--card-accent:' + c.color + '">' +
                    '<button type="button" class="preview-btn" data-example="' + escapeHtml(c.example) +
                      '" data-label="' + escapeHtml(c.example_title || c.display) +
                      '" title="Näytä esimerkki ' + escapeHtml(c.display) + '-kategoriasta">&#128065;</button>' +
                    '<span class="badge" style="color:' + c.color + ';background:' + hexToRgba(c.color, 0.16) + '">' + c.badge + '</span>' +
                    '<span class="head"><span class="name">' + c.display + '</span>' +
                    '<span class="count">' + c.count + ' tiedostoa</span></span>' +
                    '<ul class="preview">' + preview + '</ul>' +
                    '</a>';
                }).join('');

                grid.querySelectorAll('.preview-btn').forEach(function (btn) {
                  btn.addEventListener('click', function (ev) {
                    ev.preventDefault();
                    ev.stopPropagation();
                    grid.querySelectorAll('.category-card').forEach(function (el) {
                      el.classList.remove('is-active');
                    });
                    btn.closest('.category-card').classList.add('is-active');
                    if (box) showFeaturedExample(box, btn.dataset.example, btn.dataset.label);
                  });
                });

                if (box && categories.length) {
                  var featured = categories[featuredIdx];
                  showFeaturedExample(box, featured.example, featured.example_title || featured.display);
                }
              })
              .catch(function () {
                grid.dataset.loaded = '';
                grid.innerHTML = '';
              });
          });
        },
        function (hook) {
          // sivuston footer: lisätään jokaisen sisältösivun loppuun renderöidyn
          // markdownin perään (afterEach ei laukea coverpagelle, jolla on jo
          // omat linkkinsä, joten ehdollista tarkistusta ei tarvita)
          hook.afterEach(function (html, next) {
            html +=
              '<footer class="site-footer">' +
                '<div class="footer-row">' +
                  '<span class="footer-meta" id="footer-meta">' +
                    '<span class="footer-note">Sivusto päivittyy automaattisesti aina kun repoon pushataan.</span>' +
                  '</span>' +
                  '<span class="footer-links">' +
                    '<a href="#/README">Sisällysluettelo</a>' +
                    '<a href="#/tags">Tunnisteet</a>' +
                    '<a href="https://github.com/PennasenKake/All-Code_Cheat_Sheet" target="_blank" rel="noopener">GitHub</a>' +
                    '<a class="footer-top" href="javascript:void(0)">Takaisin alkuun ↑</a>' +
                  '</span>' +
                '</div>' +
              '</footer>';
            next(html);
          });
          // Sivustostatistiikka (tiedosto-/kategoriamäärä) haetaan kerran ja
          // pidetään muistissa - ei tarvitse hakea categories.json:ia
          // uudelleen jokaisella sivunvaihdolla.
          var statsCache = null;
          hook.doneEach(function () {
            var meta = document.getElementById('footer-meta');
            if (!meta) return;

            var topBtn = document.querySelector('.site-footer .footer-top');
            if (topBtn) {
              topBtn.addEventListener('click', function () {
                window.scrollTo({ top: 0, behavior: 'smooth' });
              });
            }

            var statsPromise = statsCache
              ? Promise.resolve(statsCache)
              : fetch('categories.json')
                  .then(function (r) { return r.json(); })
                  .then(function (categories) {
                    statsCache = {
                      files: categories.reduce(function (sum, c) { return sum + (c.count || 0); }, 0),
                      cats: categories.length,
                    };
                    return statsCache;
                  })
                  .catch(function () { return null; });

            // "Viimeksi päivitetty" luetaan nykyisen sivun HTTP-vastauksen
            // Last-Modified-otsikosta (GitHub Pages asettaa tämän git-
            // committien perusteella) - jos otsikkoa ei ole (esim.
            // paikallinen kehityspalvelin ei aina lähetä sitä), rivi
            // jätetään näyttämättä sen sijaan että näytettäisiin väärää tietoa.
            var pagePath = decodeURIComponent(
              (window.location.hash.replace(/^#\/?/, '').split('?')[0]) || 'README'
            );
            if (!pagePath || pagePath === '/') pagePath = 'README';
            if (!/\.[a-z0-9]+$/i.test(pagePath)) pagePath += '.md';
            var lastModPromise = fetch(pagePath, { method: 'HEAD' })
              .then(function (r) { return r.headers.get('last-modified'); })
              .catch(function () { return null; });

            Promise.all([statsPromise, lastModPromise]).then(function (results) {
              var stats = results[0];
              var lastMod = results[1];
              var parts = [];
              if (stats) {
                parts.push('<span>' + stats.files + ' muistilappua, ' + stats.cats + ' kategoriaa</span>');
              }
              if (lastMod) {
                var d = new Date(lastMod);
                if (!isNaN(d.getTime())) {
                  var formatted = d.toLocaleDateString('fi-FI', { day: 'numeric', month: 'numeric', year: 'numeric' });
                  parts.push('<span>Tämä sivu päivitetty ' + formatted + '</span>');
                }
              }
              parts.push('<span class="footer-note">Sivusto päivittyy automaattisesti aina kun repoon pushataan.</span>');
              meta.innerHTML = parts.join('<span class="dot">·</span>');
            });
          });
        },
        function (hook) {
          // tags.md: visuaalinen tagipilvi + teksti- ja kategoriasuodatin
          // sivun ylälaitaan. Kategoriasuodatin (esim. "vain Python") toimii
          // categories.json:in tag.cats-kentän avulla (generate_tags_page.py
          // tallentaa jokaiselle tagille listan juuritason kansioista joissa
          // se esiintyy), joten se ei vaadi mitään uutta sisällön merkintää.
          hook.doneEach(function () {
            if (!/\/tags([?#]|$)/.test(window.location.hash)) return;
            var section = document.querySelector('.markdown-section');
            if (!section || section.dataset.tagCloudLoaded) return;
            section.dataset.tagCloudLoaded = '1';

            Promise.all([
              fetch('tags.json').then(function (r) { return r.json(); }),
              fetch('categories.json').then(function (r) { return r.json(); }).catch(function () { return []; }),
            ])
              .then(function (results) {
                var tags = results[0];
                var categories = results[1];
                var catByName = {};
                categories.forEach(function (c) { catByName[c.name] = c; });

                var max = tags.reduce(function (m, t) { return Math.max(m, t.count); }, 1);
                var wrap = document.createElement('div');
                wrap.className = 'tag-cloud-wrap';

                // Kategoriasuodatin: "Kaikki" + yksi nappi per juuritason
                // kansio, jonka väri vastaa etusivun kategoriakortin väriä.
                var activeCat = null;
                var catFilter = document.createElement('div');
                catFilter.className = 'tag-cat-filter';
                var catNames = categories.map(function (c) { return c.name; }).filter(function (name) {
                  return tags.some(function (t) { return (t.cats || []).indexOf(name) !== -1; });
                });
                var allBtn = document.createElement('button');
                allBtn.type = 'button';
                allBtn.className = 'tag-cat-btn is-active';
                allBtn.textContent = 'Kaikki';
                catFilter.appendChild(allBtn);
                catNames.forEach(function (name) {
                  var c = catByName[name] || { display: name, color: '#6366f1' };
                  var btn = document.createElement('button');
                  btn.type = 'button';
                  btn.className = 'tag-cat-btn';
                  btn.dataset.cat = name;
                  btn.style.setProperty('--cat-color', c.color);
                  btn.innerHTML = '<span class="dotcolor" style="background:' + c.color + '"></span>' + c.display;
                  catFilter.appendChild(btn);
                });

                var input = document.createElement('input');
                input.type = 'search';
                input.className = 'tag-cloud-filter';
                input.placeholder = 'Suodata tunnisteita…';
                var cloud = document.createElement('div');
                cloud.className = 'tag-cloud';
                cloud.innerHTML = tags.map(function (t) {
                  var big = t.count >= max * 0.5 ? ' tag-chip-lg' : '';
                  return '<a class="tag-chip' + big + '" data-tag="' + t.tag.toLowerCase() + '" data-cats="' +
                    (t.cats || []).join(',') + '" href="' + t.anchor + '">' +
                    t.tag + ' <span class="tag-chip-count">' + t.count + '</span></a>';
                }).join('');
                wrap.appendChild(catFilter);
                wrap.appendChild(input);
                wrap.appendChild(cloud);
                var firstHeading = section.querySelector('h1');
                if (firstHeading && firstHeading.nextSibling) {
                  firstHeading.parentNode.insertBefore(wrap, firstHeading.nextSibling.nextSibling || null);
                } else {
                  section.insertBefore(wrap, section.firstChild);
                }

                function applyFilters() {
                  var q = input.value.trim().toLowerCase();
                  cloud.querySelectorAll('.tag-chip').forEach(function (chip) {
                    var matchesText = !q || chip.dataset.tag.indexOf(q) !== -1;
                    var chipCats = chip.dataset.cats ? chip.dataset.cats.split(',') : [];
                    var matchesCat = !activeCat || chipCats.indexOf(activeCat) !== -1;
                    chip.classList.toggle('tag-chip-hidden', !(matchesText && matchesCat));
                  });
                }

                input.addEventListener('input', applyFilters);
                catFilter.addEventListener('click', function (e) {
                  var btn = e.target.closest('.tag-cat-btn');
                  if (!btn) return;
                  catFilter.querySelectorAll('.tag-cat-btn').forEach(function (b) { b.classList.remove('is-active'); });
                  btn.classList.add('is-active');
                  activeCat = btn.dataset.cat || null;
                  applyFilters();
                });
              })
              .catch(function () {
                section.dataset.tagCloudLoaded = '';
              });
          });
        },
        function (hook) {
          // Sisältösivujen omat tagichipit: <!-- tags: ... --> -kommentti
          // (add_tags.py:n lisäämä) säilyy renderöidyssä HTML:ssä näkymättömänä
          // kommenttina - poimitaan se ja näytetään näkyvinä, klikattavina
          // chippeinä otsikon alla, jotka vievät tags-sivun vastaavaan kohtaan.
          hook.doneEach(function () {
            if (/\/tags([?#]|$)/.test(window.location.hash)) return;
            var section = document.querySelector('.markdown-section');
            if (!section || section.querySelector('.page-tags')) return;
            var walker = document.createTreeWalker(section, NodeFilter.SHOW_COMMENT, null);
            var node;
            var tagsText = null;
            while ((node = walker.nextNode())) {
              var m = node.nodeValue.match(/^\s*tags:\s*(.+?)\s*$/i);
              if (m) { tagsText = m[1]; break; }
            }
            if (!tagsText) return;
            var tags = tagsText.split(',').map(function (t) { return t.trim(); }).filter(Boolean);
            if (!tags.length) return;
            var row = document.createElement('div');
            row.className = 'page-tags';
            row.innerHTML = tags.map(function (t) {
              return '<a class="tag-chip" href="#/tags?id=' + encodeURIComponent(t.toLowerCase().replace(/\s+/g, '-')) + '">' + t + '</a>';
            }).join('');
            var firstHeading = section.querySelector('h1');
            if (firstHeading) {
              firstHeading.insertAdjacentElement('afterend', row);
            } else {
              section.insertBefore(row, section.firstChild);
            }
          });
        },
        function (hook) {
          // "Aiheeseen liittyvät" -osio sisältösivun loppuun: kerää muut
          // sivut, joilla on vähintään yksi sama tagi kuin nykyisellä
          // sivulla (tags.json:in "pages"-kentän avulla, ks.
          // generate_tags_page.py), järjestää eniten yhteisiä tageja
          // ensin. Lukee tagit jo renderöidyistä .page-tags-chipeistä
          // (edellinen hook), joten ei tarvitse jäsentää kommenttia uudelleen.
          var tagsJsonCache = null;
          hook.doneEach(function () {
            if (/\/tags([?#]|$)/.test(window.location.hash)) return;
            var section = document.querySelector('.markdown-section');
            if (!section || section.querySelector('.related-pages')) return;
            var chips = section.querySelectorAll('.page-tags a.tag-chip');
            if (!chips.length) return;
            var myTags = Array.prototype.map.call(chips, function (a) {
              return a.textContent.trim().toLowerCase();
            });
            var myHref = decodeURIComponent(window.location.hash.split('?')[0]);

            var ready = tagsJsonCache
              ? Promise.resolve(tagsJsonCache)
              : fetch('tags.json').then(function (r) { return r.json(); }).then(function (d) {
                  tagsJsonCache = d;
                  return d;
                });

            ready.then(function (allTags) {
              var scoreByHref = {};
              var titleByHref = {};
              allTags.forEach(function (entry) {
                if (myTags.indexOf(entry.tag.toLowerCase()) === -1) return;
                (entry.pages || []).forEach(function (p) {
                  var href = decodeURIComponent(p.href);
                  if (href === myHref) return;
                  scoreByHref[href] = (scoreByHref[href] || 0) + 1;
                  titleByHref[href] = p.title;
                });
              });
              var related = Object.keys(scoreByHref).map(function (href) {
                return { href: href, title: titleByHref[href], score: scoreByHref[href] };
              });
              if (!related.length) return;
              related.sort(function (a, b) {
                return b.score - a.score || a.title.localeCompare(b.title, 'fi');
              });
              related = related.slice(0, 6);

              var box = document.createElement('div');
              box.className = 'related-pages';
              box.innerHTML = '<h4 class="related-pages-title">Aiheeseen liittyvät</h4>' +
                '<ul class="related-pages-list">' +
                related.map(function (r) {
                  return '<li><a href="' + r.href + '">' + escapeHtmlLite(r.title) + '</a></li>';
                }).join('') +
                '</ul>';

              var footer = section.querySelector('.site-footer');
              if (footer) {
                footer.insertAdjacentElement('beforebegin', box);
              } else {
                section.appendChild(box);
              }
            }).catch(function () {});

            function escapeHtmlLite(s) {
              return String(s).replace(/[&<>]/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
              });
            }
          });
        },
        function (hook) {
          // Etusivun oma hakukenttä (#cover-search): näkyy heti heron
          // alla, mutta ei ole oma erillinen hakumoottori - syöte
          // peilataan Docsifyn OIKEAAN sivupalkin hakukenttään (sama
          // valmiiksi indeksoity haku kuin muuallakin sivustolla) ja
          // tulokset kopioidaan MutationObserverilla takaisin tähän.
          hook.doneEach(function () {
            var input = document.getElementById('cover-search');
            var box = document.getElementById('cover-search-results');
            if (!input || !box || input.dataset.wired) return;
            input.dataset.wired = '1';

            function realInput() {
              return document.querySelector('.sidebar .search input[type="search"]');
            }
            function realPanel() {
              return document.querySelector('.sidebar .search .results-panel');
            }

            var observer = null;
            function sync() {
              var panel = realPanel();
              var html = panel ? panel.innerHTML : '';
              box.innerHTML = html;
              box.classList.toggle('has-results', !!html.trim());
            }
            function ensureObserver() {
              var panel = realPanel();
              if (!panel || observer) return;
              observer = new MutationObserver(sync);
              observer.observe(panel, { childList: true, subtree: true });
            }

            input.addEventListener('input', function () {
              var real = realInput();
              if (!real) return;
              ensureObserver();
              real.value = input.value;
              real.dispatchEvent(new Event('input', { bubbles: true }));
              // Docsifyn oma haku debounceaa 100ms - synkataan hieman
              // sen jälkeen varmuuden vuoksi (MutationObserver hoitaa
              // yleensä jo tämän, mutta tämä on varmistus).
              setTimeout(sync, 160);
            });

            box.addEventListener('click', function (e) {
              if (e.target.closest('a')) {
                setTimeout(function () {
                  input.value = '';
                  box.innerHTML = '';
                  box.classList.remove('has-results');
                }, 0);
              }
            });

            input.addEventListener('keydown', function (e) {
              if (e.key === 'Escape') {
                input.value = '';
                box.innerHTML = '';
                box.classList.remove('has-results');
                input.blur();
              }
            });
          });
        },
        function (hook) {
          // Pikanäppäin "/" fokusoi lähimmän hakukentän (etusivulla oman
          // hakukentän, muualla sivupalkin haun) mistä tahansa sivulta -
          // paitsi jos käyttäjä kirjoittaa jo johonkin toiseen kenttään.
          hook.doneEach(function () {
            if (document.body.dataset.slashSearchWired) return;
            document.body.dataset.slashSearchWired = '1';
            document.addEventListener('keydown', function (e) {
              if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
              var t = e.target;
              var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
              if (typing) return;
              // #cover-search voi jäädä DOM:iin piilotettuna (Docsifyn
              // coverpage-elementti ei aina poistu kokonaan reitin
              // vaihtuessa) - varmistetaan että se on oikeasti näkyvissä,
              // muuten focus() ei tehoa mihinkään ja fokus jää <body>:hyn.
              var cs = document.getElementById('cover-search');
              var target = (cs && cs.offsetParent !== null) ? cs : null;
              if (!target) target = document.querySelector('.sidebar .search input[type="search"]');
              if (!target) return;
              e.preventDefault();
              document.body.classList.remove('close');
              target.focus();
            });
          });
        },
        function (hook) {
          // README:n sisällysluettelon kategriaotsikot (### Bash, ### Python...)
          // saavat saman värikoodatun badgen kuin etusivun kategoriakortit,
          // jotta sisältösivu tuntuu samalta järjestelmältä kuin etusivu -
          // ei vaadi muutoksia otsikkotekstiin/ankkuri-id:hin, koska badge
          // lisätään DOM:iin jälkikäteen otsikon tekstin eteen.
          var categoriesCache = null;
          hook.doneEach(function () {
            var section = document.querySelector('.markdown-section');
            if (!section) return;
            var h3s = Array.prototype.slice.call(section.querySelectorAll('h3'));
            h3s = h3s.filter(function (h) { return !h.dataset.catBadged; });
            if (!h3s.length) return;

            var ready = categoriesCache
              ? Promise.resolve(categoriesCache)
              : fetch('categories.json').then(function (r) { return r.json(); }).then(function (c) {
                  categoriesCache = c;
                  return c;
                });

            ready.then(function (categories) {
              var byLabel = {};
              categories.forEach(function (c) {
                byLabel[c.display] = c;
                byLabel[c.name] = c;
              });
              h3s.forEach(function (h) {
                h.dataset.catBadged = '1';
                var span = h.querySelector('a.anchor span');
                var text = (span ? span.textContent : h.textContent).trim();
                var c = byLabel[text];
                if (!c) return;
                var badge = document.createElement('span');
                badge.className = 'cat-heading-badge';
                badge.textContent = c.badge;
                badge.style.color = c.color;
                var hex = String(c.color || '').replace('#', '');
                if (hex.length === 6) {
                  var r = parseInt(hex.substring(0, 2), 16);
                  var g = parseInt(hex.substring(2, 4), 16);
                  var b = parseInt(hex.substring(4, 6), 16);
                  badge.style.background = 'rgba(' + r + ',' + g + ',' + b + ',0.16)';
                }
                var anchor = h.querySelector('a.anchor') || h;
                anchor.insertBefore(badge, anchor.firstChild);
              });
            }).catch(function () {});
          });
        },
      ],
    };
  </script>
