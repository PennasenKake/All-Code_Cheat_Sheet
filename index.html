<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <title>All-Code Cheat Sheet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <meta name="description" content="Koodin muistilappuja ja esimerkkejä usealle eri kielelle, suomeksi." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />
  <style>
    :root {
      --accent: #6366f1;
      --accent-2: #a855f7;
      --accent-dark: #4f46e5;
      --bg: #09090b;
      --bg-soft: #131316;
      --bg-elevated: #18181b;
      --text: #f4f4f5;
      --text-soft: #a1a1aa;
      --text-faint: #71717a;
      --border: #27272a;
      --code-bg: #131316;
      --theme-color: var(--accent);
      --header-h: 60px;
      --header-bg: rgba(9, 9, 11, 0.72);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --bg-soft: #f6f6f8;
        --bg-elevated: #ffffff;
        --text: #18181b;
        --text-soft: #52525b;
        --text-faint: #8a8a93;
        --border: #e4e4e7;
        --code-bg: #f6f6f8;
        --header-bg: rgba(255, 255, 255, 0.72);
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      color: var(--text);
    }

    pre, code, kbd {
      font-family: 'JetBrains Mono', "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace !important;
    }

    /* --- Yläpalkki (kiinteä, kaikilla sivuilla) --- */
    #site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    #site-header .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      text-decoration: none !important;
    }
    #site-header .brand .logo-badge {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    #site-header .links {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    #site-header a.ghlink {
      color: var(--text-soft);
      font-size: 0.85rem;
      text-decoration: none !important;
      transition: color 0.15s ease;
    }
    #site-header a.ghlink:hover {
      color: var(--accent);
    }

    /* --- Sivupalkki --- */
    .sidebar {
      background: var(--bg-soft);
      border-right: 1px solid var(--border);
      top: var(--header-h) !important;
      height: calc(100vh - var(--header-h)) !important;
    }
    .content {
      padding-top: var(--header-h);
    }
    .sidebar-nav a {
      color: var(--text-soft);
      border-radius: 8px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .sidebar-nav a:hover {
      color: var(--text);
      background: var(--bg-elevated);
    }
    .sidebar-nav li.active > a {
      color: #fff;
      font-weight: 600;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }
    .sidebar-nav > ul > li > a {
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0.01em;
      color: var(--text);
    }
    .sidebar ul li ul {
      border-left: 1px solid var(--border);
      margin-left: 8px;
      padding-left: 4px;
    }
    .sidebar-nav strong, .app-name-link {
      color: var(--text) !important;
    }

    /* --- Sisältöalue --- */
    .markdown-section {
      max-width: 820px;
      padding: 30px 40px 80px;
    }
    .markdown-section h1 {
      font-size: 2.1rem;
      font-weight: 800;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.4em;
    }
    .markdown-section h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 2.2em;
      padding-top: 0.4em;
      border-top: 1px solid var(--border);
    }
    .markdown-section h3 { font-weight: 700; }
    .markdown-section p, .markdown-section li {
      line-height: 1.7;
      color: var(--text);
    }
    .markdown-section a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(99, 102, 241, 0.35);
    }
    .markdown-section a:hover {
      border-bottom-color: var(--accent);
    }

    /* --- Koodilohkot --- */
    .markdown-section pre {
      background: var(--code-bg) !important;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .markdown-section code {
      background: var(--bg-elevated);
      border-radius: 5px;
      padding: 0.15em 0.4em;
      font-size: 0.85em;
    }
    .markdown-section pre > code {
      padding: 0;
      background: transparent;
    }
    .docsify-copy-code-button {
      background: var(--bg-elevated) !important;
      border: 1px solid var(--border) !important;
      color: var(--text-soft) !important;
      border-radius: 6px !important;
    }
    .docsify-copy-code-button:hover {
      color: #fff !important;
      background: var(--accent) !important;
      border-color: var(--accent) !important;
    }

    /* --- Haku --- */
    .search {
      margin-bottom: 10px;
    }
    .search input {
      border-radius: 10px !important;
      border: 1px solid var(--border) !important;
      background: var(--bg-elevated) !important;
      color: var(--text) !important;
    }
    .search input:focus {
      outline: none !important;
      border-color: var(--accent) !important;
    }
    .search .results-panel {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .search a { color: var(--text) !important; }
    .search .matching-post p { color: var(--text-soft) !important; }
    .search h2 { border-bottom: 1px solid var(--border); }

    /* --- Etusivu (cover) --- */
    section.cover {
      background:
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.25), transparent 45%),
        radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.2), transparent 45%),
        var(--bg) !important;
      min-height: calc(100vh - var(--header-h)) !important;
      padding: 40px 20px !important;
    }
    section.cover .cover-main {
      max-width: 920px;
      /* .cover-main on flex-item (theme asettaa flex:1), ja ilman tätä sen
         automaattinen minimileveys määräytyy sisällä olevan CSS Gridin
         (.category-grid, auto-fit+minmax) sisältöpohjaisesta minimistä, joka
         yrittää mahduttaa KAIKKI kortit yhdelle riville — tämä työnsi koko
         heron ja gridin leveämmäksi kuin näyttö kapeilla laitteilla. */
      min-width: 0;
      width: 100%;
      box-sizing: border-box;
    }
    .cover-badge {
      width: 60px;
      height: 60px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-weight: 700;
      font-size: 1.5rem;
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.35);
    }
    .cover-hero {
      font-size: 2.7rem;
      line-height: 1.18;
      font-weight: 800;
      color: var(--text);
      margin: 0 0 0.5em;
      letter-spacing: -0.01em;
    }
    .cover-hero .grad-text {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    section.cover blockquote {
      color: var(--text-soft);
      font-size: 1.1rem;
      max-width: 640px;
      margin: 0 auto 0.6em;
    }
    .cover-meta {
      color: var(--text-faint);
      font-size: 0.85rem;
      margin-top: -0.3em;
    }
    .cover-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 1.6em 0 0;
    }
    .cover-buttons a {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 10px;
      border: 1.5px solid var(--accent);
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none !important;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .cover-buttons a:first-child {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: #fff;
    }
    .cover-buttons a:hover {
      transform: translateY(-2px);
    }

    /* --- Kategoriakortit (etusivu) --- */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      max-width: 880px;
      width: 100%;
      margin: 2.2em auto;
      text-align: left;
      box-sizing: border-box;
    }
    .category-grid:empty::before {
      content: attr(data-loading);
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-faint);
      font-size: 0.85rem;
    }
    .category-card {
      display: block;
      min-width: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: 18px;
      border-radius: 14px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      text-decoration: none !important;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .category-card:hover {
      transform: translateY(-4px);
      border-color: var(--card-accent, var(--accent));
    }
    .category-card .badge {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      margin-bottom: 10px;
    }
    .category-card .head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .category-card .name {
      display: block;
      font-weight: 600;
      color: var(--text);
      font-size: 0.95rem;
    }
    .category-card .count {
      display: block;
      color: var(--text-faint);
      font-size: 0.74rem;
      white-space: nowrap;
    }
    .category-card .preview {
      list-style: none;
      margin: 10px 0 0;
      padding: 0;
    }
    .category-card .preview li {
      color: var(--text-soft);
      font-size: 0.8rem;
      line-height: 1.8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .category-card .preview li::before {
      content: '›';
      color: var(--card-accent, var(--accent));
      margin-right: 6px;
      font-weight: 700;
    }

    /* --- Esimerkkiosio (etusivu) --- */
    .showcase-label {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-faint);
      max-width: 880px;
      margin: 2.6em auto 0.8em;
      text-align: left;
    }
    .featured-example {
      max-width: 880px;
      margin: 0 auto;
      text-align: left;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--bg-elevated);
      overflow: hidden;
    }
    .featured-example:empty {
      display: none;
    }
    .featured-example .fx-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
    }
    .featured-example .fx-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }
    .featured-example .fx-lang {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-faint);
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
    }
    .featured-example .fx-copy {
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .featured-example .fx-copy:hover {
      background: var(--accent-dark);
    }
    .featured-example pre {
      margin: 0;
      max-height: 340px;
      overflow: auto;
      border: none !important;
      border-radius: 0 !important;
      background: var(--code-bg) !important;
    }
    .featured-example pre code {
      background: transparent;
      padding: 18px !important;
      display: block;
    }

    /* --- Sivutus (pagination) --- */
    .pagination-item-label {
      color: var(--text-faint);
    }
    .pagination-item-title {
      color: var(--accent);
    }

    /* --- Mobiili --- */
    @media (max-width: 768px) {
      .markdown-section {
        padding: 20px 20px 60px;
      }
      .category-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .cover-hero {
        font-size: 2rem;
      }
      section.cover blockquote {
        font-size: 1rem;
      }
      #site-header .links {
        gap: 10px;
      }
    }

    @media (max-width: 480px) {
      section.cover {
        padding: 32px 14px !important;
      }
      .cover-hero {
        font-size: 1.6rem;
      }
      .category-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .category-card {
        padding: 14px;
      }
      .cover-buttons {
        flex-direction: column;
        align-items: stretch;
      }
      .cover-buttons a {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header id="site-header">
    <a class="brand" href="#/">
      <span class="logo-badge">{ }</span>
      <span>All-Code Cheat Sheet</span>
    </a>
    <div class="links">
      <a class="ghlink" href="https://github.com/PennasenKake/All-Code_Cheat_Sheet" target="_blank" rel="noopener">GitHub</a>
    </div>
  </header>
  <div id="app">Ladataan…</div>
  <script>
    window.$docsify = {
      name: 'All-Code Cheat Sheet',
      repo: 'PennasenKake/All-Code_Cheat_Sheet',
      loadSidebar: '_sidebar.md',
      coverpage: '_coverpage.md',
      onlyCover: false,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      loadNavbar: false,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Hae muistilapuista…',
        noData: 'Ei tuloksia.',
        depth: 4,
      },
      copyCode: {
        buttonText: 'Kopioi',
        errorText: 'Virhe',
        successText: 'Kopioitu',
      },
      pagination: {
        crossChapter: true,
        crossChapterText: true,
      },
      formatUpdated: '{MM}/{DD}/{YYYY}',
      plugins: [
        function (hook) {
          // suurenna kuvat klikkaamalla (medium-zoom), ladattu erikseen alla
          hook.doneEach(function () {
            if (window.mediumZoom) {
              window.mediumZoom('.markdown-section img', {
                background: 'rgba(9, 9, 11, 0.9)',
              });
            }
          });
        },
        function (hook) {
          // etusivun kategoriakortit: luetaan categories.json ja renderöidään
          // kortit suoraan selaimessa, jotta ne pysyvät aina ajan tasalla
          hook.doneEach(function () {
            var grid = document.getElementById('category-grid');
            if (!grid || grid.dataset.loaded) return;
            grid.dataset.loaded = '1';

            function hexToRgba(hex, alpha) {
              var h = hex.replace('#', '');
              var r = parseInt(h.substring(0, 2), 16);
              var g = parseInt(h.substring(2, 4), 16);
              var b = parseInt(h.substring(4, 6), 16);
              return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
            }

            function escapeHtml(s) {
              return String(s).replace(/[&<>]/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
              });
            }

            fetch('categories.json')
              .then(function (r) { return r.json(); })
              .then(function (categories) {
                grid.innerHTML = categories.map(function (c) {
                  var preview = (c.preview || []).map(function (t) {
                    return '<li>' + escapeHtml(t) + '</li>';
                  }).join('');
                  return '<a class="category-card" href="' + c.href + '" style="--card-accent:' + c.color + '">' +
                    '<span class="badge" style="color:' + c.color + ';background:' + hexToRgba(c.color, 0.16) + '">' + c.badge + '</span>' +
                    '<span class="head"><span class="name">' + c.display + '</span>' +
                    '<span class="count">' + c.count + ' tiedostoa</span></span>' +
                    '<ul class="preview">' + preview + '</ul>' +
                    '</a>';
                }).join('');
              })
              .catch(function () {
                grid.dataset.loaded = '';
              });
          });
        },
        function (hook) {
          // etusivun esimerkkiosio: haetaan oikea koodisivu ja näytetään se
          // korostettuna paneelina, kopiointinapilla
          var FEATURED_SRC = 'Python/hello_world.py.md';
          var FEATURED_LABEL = 'hello_world.py';
          var FEATURED_LANG = 'python';

          hook.doneEach(function () {
            var box = document.getElementById('featured-example');
            if (!box || box.dataset.loaded) return;
            box.dataset.loaded = '1';

            fetch(FEATURED_SRC)
              .then(function (r) { return r.text(); })
              .then(function (text) {
                var m = text.match(/```+[a-z]*\n([\s\S]*?)\n```+/i);
                var code = m ? m[1] : text;
                var codeEl = document.createElement('code');
                codeEl.className = 'language-' + FEATURED_LANG;
                codeEl.textContent = code;
                var pre = document.createElement('pre');
                pre.appendChild(codeEl);

                box.innerHTML =
                  '<div class="fx-head">' +
                    '<span class="fx-title">' + FEATURED_LABEL +
                      '<span class="fx-lang">' + FEATURED_LANG + '</span>' +
                    '</span>' +
                    '<button type="button" class="fx-copy">Kopioi koodi</button>' +
                  '</div>';
                box.appendChild(pre);

                if (window.Prism) {
                  window.Prism.highlightElement(codeEl);
                }

                var btn = box.querySelector('.fx-copy');
                btn.addEventListener('click', function () {
                  navigator.clipboard.writeText(code).then(function () {
                    btn.textContent = 'Kopioitu!';
                    setTimeout(function () { btn.textContent = 'Kopioi koodi'; }, 1500);
                  });
                });
              })
              .catch(function () {
                box.dataset.loaded = '';
              });
          });
        },
      ],
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/medium-zoom/dist/medium-zoom.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-markup.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-css.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-jsx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-docker.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-csharp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-java.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-yaml.min.js"></script>
</body>
</html>
